name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xcellent
          POSTGRES_PASSWORD: xcellent
          POSTGRES_DB: xcellentday_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xcellent" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://xcellent:xcellent@localhost:5432/xcellentday_test
      DATABASE_URL: postgresql+psycopg://xcellent:xcellent@localhost:5432/xcellentday_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry==2.4.3
      - run: poetry install --no-root
      - run: poetry run ruff check .
      - run: poetry run alembic upgrade head && poetry run alembic check && poetry run alembic downgrade base
      - run: poetry run pytest --cov --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
